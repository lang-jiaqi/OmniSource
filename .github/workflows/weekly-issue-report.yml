name: Weekly GitHub Issue Report

concurrency:
  group: omnisource-reports
  cancel-in-progress: false

on:
  schedule:
    - cron: "41 0 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      OMNISOURCE_ISSUE_REPOSITORY: ${{ github.repository == 'lang-jiaqi/OmniSource' && 'lang-jiaqi/OmniSource-workspace' || '' }}
      OMNISOURCE_ISSUE_TOKEN: ${{ github.repository == 'lang-jiaqi/OmniSource' && secrets.OMNISOURCE_ISSUE_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Restore report memory
        uses: actions/cache/restore@v4
        with:
          path: data/memory.db
          key: omnisource-memory-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            omnisource-memory-${{ github.ref_name }}-
      - name: Generate one weekly Issue per active track
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_TIMEOUT_SECONDS: ${{ secrets.OPENAI_COMPATIBLE_TIMEOUT_SECONDS }}
          OPENAI_COMPATIBLE_MAX_RETRIES: ${{ secrets.OPENAI_COMPATIBLE_MAX_RETRIES }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMNISOURCE_REQUIRE_LLM: "1"
        run: |
          mkdir -p data
          touch data/memory.db
          mapfile -t tracks < <(uv run omnisource active-tracks)
          failed=0
          for track in "${tracks[@]}"; do
            if ! uv run omnisource weekly --track "$track"; then
              failed=1
              echo "::error::Track failed: $track"
            fi
          done
          exit "$failed"
      - name: Save report memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/memory.db
          key: omnisource-memory-${{ github.ref_name }}-${{ github.run_id }}
