github_query: "LLM serving OR inference engine OR distributed training OR CUDA kernel OR GPU inference"
github_trending_periods:
  - daily
  - weekly
github_fallback_created_days: 120
github_days: 14
github_top: 30

hn_query: "LLM serving OR inference engine OR distributed training OR CUDA kernel OR GPU inference"
hn_top: 50

reddit_subreddits:
  - MachineLearning
  - LocalLLaMA
reddit_top: 50

topics:
  - name: 训练系统
    children:
      - name: 并行与分布式训练
        children:
          - data / model / pipeline parallelism
          - large-scale pretraining systems
          - checkpoint / fault tolerance
      - name: 集群调度与可靠性
        children:
          - cluster scheduling
          - resource management / elasticity
  - name: 推理系统
    children:
      - name: Serving 引擎
        children:
          - LLM serving / inference engines
          - batching / routing / latency
          - agent serving systems
      - name: 内存与解码优化
        children:
          - KV cache / long context memory
          - quantization / compression
          - speculative decoding
  - name: 编译器、内核与硬件
    children:
      - name: 编译器与运行时
        children:
          - compiler / runtime
          - graph optimization
      - name: GPU/加速器内核
        children:
          - CUDA / kernel optimization
          - accelerator / edge inference
  - name: 基准与观测
    children:
      - name: Infra 评测
        children:
          - AI infrastructure benchmarks
          - profiling / observability

topic_translations:
  训练系统: Training Systems
  并行与分布式训练: Parallel and Distributed Training
  集群调度与可靠性: Cluster Scheduling and Reliability
  推理系统: Inference Systems
  Serving 引擎: Serving Engines
  内存与解码优化: Memory and Decoding Optimization
  编译器、内核与硬件: Compilers, Kernels, and Hardware
  编译器与运行时: Compilers and Runtime
  GPU/加速器内核: GPU / Accelerator Kernels
  基准与观测: Benchmarks and Observability
  Infra 评测: Infrastructure Evaluation

llm:
  provider: openai
  model: gpt-4.1-mini

ranking:
  relevance: 0.4
  novelty: 0.3
  popularity: 0.2
  code_available: 0.1

quality_distill:
  min_score: 0.18
  buffer: 12
  fill_quota_types:
    - paper
    - repo
    - blog

graph_author_enrichment_top_papers: 15
graph_author_enrichment_timeout_seconds: 600
graph_max_authors_per_paper: 12

output:
  top_papers: 15
  top_repos: 5
  top_blogs: 5
  top_social: 5
  analysis_buffer: 0
  language: "中文"
  languages:
    - "中文"
    - "English"
