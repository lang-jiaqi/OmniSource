name: ai-infra
display_name: "AI 基础设施"
display_names:
  zh: "AI 基础设施"
  en: "AI Infrastructure"
description: "面向分布式训练、推理服务、系统、编译器、内核与集群的 AI 基础设施。"
descriptions:
  zh: "面向分布式训练、推理服务、系统、编译器、内核与集群的 AI 基础设施。"
  en: "AI infrastructure for distributed training, inference serving, systems, compilers, kernels, and clusters."

sources:
